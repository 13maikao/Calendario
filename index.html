<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escala & Folgas - PWA com Biometria</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    // ================= SCRIPT DE WEBAUTHN / BIOMETRIA COM FALLBACK ================= //

    // Verifica suporte a WebAuthn / Biometria no navegador do dispositivo
    const isBiometricSupported = window.PublicKeyCredential && 
      typeof window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function' &&
      window.isSecureContext;

    let isSignUpMode = false;

    window.addEventListener('DOMContentLoaded', async () => {
      checkBiometricAvailability();
    });

    // 1. Checa se o dispositivo possui leitor biométrico/FaceID e se já foi cadastrado
    async function checkBiometricAvailability() {
      const bioContainer = document.getElementById('biometric-login-container');
      const savedCredId = localStorage.getItem('bio_cred_id');
      const savedPasscode = localStorage.getItem('bio_passcode_pin');

      if (savedCredId || savedPasscode) {
        if (bioContainer) bioContainer.classList.remove('hidden');
      } else if (isBiometricSupported) {
        try {
          const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          if (available && savedCredId && bioContainer) {
            bioContainer.classList.remove('hidden');
          }
        } catch (e) {
          console.warn('Verificação de biometria não permitida no contexto atual:', e);
        }
      }
    }

    // 2. Registar Biometria / Face ID (Com suporte a Fallback em iFrames)
    async function registerBiometrics() {
      const email = document.getElementById('authEmail')?.value || localStorage.getItem('user_email') || 'usuario@app.com';

      // Tentativa de registro WebAuthn Nativo
      if (isBiometricSupported) {
        try {
          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);
          const userId = new TextEncoder().encode(email);

          const publicKeyCredentialCreationOptions = {
            challenge: challenge,
            rp: {
              name: 'Meu App de Folgas',
              id: window.location.hostname
            },
            user: {
              id: userId,
              name: email,
              displayName: email.split('@')[0]
            },
            pubKeyCredParams: [{ alg: -7, type: 'public-key' }, { alg: -257, type: 'public-key' }],
            authenticatorSelection: {
              authenticatorAttachment: 'platform',
              userVerification: 'required'
            },
            timeout: 60000
          };

          const credential = await navigator.credentials.create({
            publicKey: publicKeyCredentialCreationOptions
          });

          if (credential) {
            const credIdBase64 = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
            localStorage.setItem('bio_cred_id', credIdBase64);
            localStorage.setItem('user_email', email);

            const badge = document.getElementById('biometric-badge');
            if (badge) badge.classList.remove('hidden');
            const promptCard = document.getElementById('biometric-prompt-card');
            if (promptCard) promptCard.classList.add('hidden');
            
            alert('Biometria / Face ID configurada com sucesso neste dispositivo!');
            checkBiometricAvailability();
            return;
          }
        } catch (err) {
          console.warn('WebAuthn nativo bloqueado ou indisponível:', err);
          // Caso a Permissions Policy bloqueie em iFrames ou navegadores integrados
        }
      }

      // Fallback: Ativação de PIN / Bloqueio Rápido de Dispositivo
      const pin = prompt("O uso de biometria direta nesta página está limitado pela política de segurança do seu navegador/iframe.\n\nCrie um PIN rápido de 4 dígitos para acesso instantâneo neste aparelho:");
      if (pin && pin.length >= 4) {
        localStorage.setItem('bio_passcode_pin', pin);
        localStorage.setItem('user_email', email);
        alert('Acesso Rápido por PIN ativado com sucesso para este dispositivo!');
        checkBiometricAvailability();
      }
    }

    // 3. Autenticar usando Biometria / Face ID ou PIN de Acesso Rápido
    async function loginWithBiometrics() {
      const savedCredId = localStorage.getItem('bio_cred_id');
      const savedPasscode = localStorage.getItem('bio_passcode_pin');
      const savedEmail = localStorage.getItem('user_email');

      // Tenta autenticação WebAuthn nativa se houver chave cadastrada
      if (savedCredId && isBiometricSupported) {
        try {
          const challenge = new Uint8Array(32);
          window.crypto.getRandomValues(challenge);
          const rawCredId = Uint8Array.from(atob(savedCredId), c => c.charCodeAt(0));

          const publicKeyCredentialRequestOptions = {
            challenge: challenge,
            allowCredentials: [{
              id: rawCredId,
              type: 'public-key'
            }],
            userVerification: 'required',
            timeout: 60000
          };

          const assertion = await navigator.credentials.get({
            publicKey: publicKeyCredentialRequestOptions
          });

          if (assertion) {
            document.getElementById('loginScreen')?.classList.add('hidden');
            document.getElementById('mainAppContainer')?.classList.remove('hidden');
            return;
          }
        } catch (err) {
          console.warn('Erro na autenticação biométrica nativa:', err);
        }
      }

      // Fallback para PIN Rápido
      if (savedPasscode) {
        const inputPin = prompt("Digite o seu PIN de 4 dígitos para desbloquear:");
        if (inputPin === savedPasscode) {
          document.getElementById('loginScreen')?.classList.add('hidden');
          document.getElementById('mainAppContainer')?.classList.remove('hidden');
        } else if (inputPin !== null) {
          showError('PIN incorreto. Tente usar seu E-mail e Senha do Firebase.');
        }
      } else {
        showError('Biometria indisponível ou bloqueada pela Permissions Policy neste domínio. Faça login com e-mail e senha.');
      }
    }

    function showError(msg) {
      const errDiv = document.getElementById('loginErrorMsg') || document.getElementById('auth-error');
      if (errDiv) {
        errDiv.innerText = msg;
        errDiv.classList.remove('hidden');
      } else {
        alert(msg);
      }
    }
  </script>
  <style>
    /* Transições suaves e estética moderna */
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between antialiased selection:bg-brand-500 selection:text-white">

  <!-- ================= ATUALIZAÇÃO DO MODAL / TELA DE LOGIN COM BIOMETRIA ================= -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md">
    <div class="glass-card w-full max-w-md p-6 sm:p-8 rounded-3xl shadow-2xl relative border border-slate-800 text-center space-y-6">
      
      <!-- Ícone Principal -->
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-brand-500/20">
        <i class="fa-solid fa-shield-halved text-2xl text-white"></i>
      </div>

      <div class="space-y-1">
        <h2 id="auth-title" class="text-2xl font-bold tracking-tight text-white">Segurança do App</h2>
        <p id="auth-subtitle" class="text-sm text-slate-400">Acesse com sua conta para sincronizar dados e biometria.</p>
      </div>

      <!-- BOTÃO DE LOGIN POR BIOMETRIA / FACE ID (Exibido se configurado) -->
      <div id="biometric-login-container" class="hidden space-y-3 pt-2">
        <button id="btn-biometric-login" onclick="loginWithBiometrics()" class="w-full py-3.5 px-4 bg-slate-800 hover:bg-slate-700 active:scale-[0.98] border border-brand-500/30 text-brand-400 font-semibold rounded-2xl transition flex items-center justify-center gap-3 shadow-md">
          <i class="fa-solid fa-fingerprint text-xl"></i>
          <span>Entrar com Biometria / Face ID</span>
        </button>
        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-slate-800"></div>
          <span class="flex-shrink mx-3 text-xs text-slate-500 uppercase tracking-widest">ou entre com e-mail</span>
          <div class="flex-grow border-t border-slate-800"></div>
        </div>
      </div>

      <!-- Form de Login / Cadastro por E-mail -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">E-mail</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-slate-500"></i>
            <input type="email" id="auth-email" required placeholder="seu@email.com" class="w-full bg-slate-900/80 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-white placeholder-slate-600 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Senha</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-500"></i>
            <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-slate-900/80 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-white placeholder-slate-600 transition">
          </div>
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full py-3.5 px-4 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 active:scale-[0.98] text-white font-semibold rounded-xl shadow-lg shadow-brand-500/20 transition flex items-center justify-center gap-2">
          <span id="auth-btn-text">Entrar</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- Alternar entre Login e Cadastro -->
      <div class="text-xs text-slate-400">
        <button id="auth-toggle-btn" onclick="toggleAuthMode()" class="text-brand-400 hover:underline font-medium">
          Não tem conta? Clique para criar uma
        </button>
      </div>

      <!-- Feedback de Erros/Avisos -->
      <div id="auth-error" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-lg p-2.5"></div>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL DO APLICATIVO -->
  <main class="max-w-xl mx-auto w-full p-4 space-y-6">
    <header class="flex justify-between items-center py-4">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Minhas Folgas</h1>
        <p class="text-xs text-slate-400" id="user-display-email">Sincronizado</p>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- Botão para Ativar/Gerenciar Biometria -->
        <button id="btn-register-biometrics" onclick="registerBiometrics()" class="p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-slate-300 hover:text-brand-400 hover:border-brand-500/50 transition relative" title="Ativar Biometria / Face ID">
          <i class="fa-solid fa-fingerprint text-lg"></i>
          <span id="biometric-badge" class="hidden absolute -top-1 -right-1 w-2.5 h-2.5 bg-brand-500 rounded-full"></span>
        </button>

        <button onclick="logout()" class="p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-slate-400 hover:text-rose-400 transition" title="Sair">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- Card de Boas-Vindas à Biometria (exibido apenas uma vez) -->
    <div id="biometric-prompt-card" class="hidden glass-card p-4 rounded-2xl border border-brand-500/30 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="p-3 bg-brand-500/10 text-brand-400 rounded-xl">
          <i class="fa-solid fa-fingerprint text-2xl"></i>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-white">Ativar Face ID / Biometria?</h3>
          <p class="text-xs text-slate-400">Entre no app no futuro com apenas um toque.</p>
        </div>
      </div>
      <button onclick="registerBiometrics()" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-lg transition">Ativar</button>
    </div>

    <!-- Exemplo de Conteúdo Simulado -->
    <section class="glass-card p-6 rounded-3xl space-y-4">
      <h2 class="text-lg font-semibold text-white flex items-center gap-2">
        <i class="fa-solid fa-calendar-days text-brand-500"></i> Próximas Folgas
      </h2>
      <div class="space-y-2 text-sm text-slate-300">
        <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 flex justify-between">
          <span>Sábado, 24 de Outubro</span>
          <span class="text-brand-400 font-medium">Folga Confirmada</span>
        </div>
        <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 flex justify-between">
          <span>Domingo, 25 de Outubro</span>
          <span class="text-brand-400 font-medium">Folga Confirmada</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ================= SCRIPT DE WEBAUTHN / BIOMETRIA ================= //

    // Verifica suporte a WebAuthn / Biometria no navegador do dispositivo
    const isBiometricSupported = window.PublicKeyCredential && 
      typeof window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function';

    let isSignUpMode = false;

    window.addEventListener('DOMContentLoaded', async () => {
      checkBiometricAvailability();
    });

    // 1. Checa se o dispositivo possui leitor biométrico/FaceID e se já foi cadastrado
    async function checkBiometricAvailability() {
      const bioContainer = document.getElementById('biometric-login-container');
      const savedCredId = localStorage.getItem('bio_cred_id');

      if (isBiometricSupported) {
        const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        if (available && savedCredId) {
          bioContainer.classList.remove('hidden');
        }
      }
    }

    // 2. Registar Biometria / Face ID (Após login)
    async function registerBiometrics() {
      const email = document.getElementById('auth-email').value || localStorage.getItem('user_email') || 'usuario@app.com';

      if (!isBiometricSupported) {
        alert('O seu navegador ou dispositivo não suporta biometria/Face ID nativo.');
        return;
      }

      try {
        // Desafio simulado para geração da chave pública WebAuthn
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        const userId = new TextEncoder().encode(email);

        const publicKeyCredentialCreationOptions = {
          challenge: challenge,
          rp: {
            name: 'Meu App de Folgas',
            id: window.location.hostname
          },
          user: {
            id: userId,
            name: email,
            displayName: email.split('@')[0]
          },
          pubKeyCredParams: [{ alg: -7, type: 'public-key' }], // ES256
          authenticatorSelection: {
            authenticatorAttachment: 'platform', // Plataforma nativa (FaceID / TouchID / Windows Hello)
            userVerification: 'required'
          },
          timeout: 60000
        };

        const credential = await navigator.credentials.create({
          publicKey: publicKeyCredentialCreationOptions
        });

        if (credential) {
          // Salva o ID da credencial localmente para os próximos logins
          const credIdBase64 = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
          localStorage.setItem('bio_cred_id', credIdBase64);
          localStorage.setItem('user_email', email);

          document.getElementById('biometric-badge').classList.remove('hidden');
          document.getElementById('biometric-prompt-card').classList.add('hidden');
          alert('Biometria / Face ID cadastrado com sucesso neste dispositivo!');
          checkBiometricAvailability();
        }
      } catch (err) {
        console.error('Erro ao registrar biometria:', err);
        alert('Não foi possível registrar a biometria: ' + err.message);
      }
    }

    // 3. Autenticar usando Biometria / Face ID
    async function loginWithBiometrics() {
      const savedCredId = localStorage.getItem('bio_cred_id');
      const savedEmail = localStorage.getItem('user_email');

      if (!savedCredId) {
        showError('Nenhuma biometria cadastrada neste dispositivo.');
        return;
      }

      try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        // Converte a credencial salva para array de bytes
        const rawCredId = Uint8Array.from(atob(savedCredId), c => c.charCodeAt(0));

        const publicKeyCredentialRequestOptions = {
          challenge: challenge,
          allowCredentials: [{
            id: rawCredId,
            type: 'public-key'
          }],
          userVerification: 'required',
          timeout: 60000
        };

        const assertion = await navigator.credentials.get({
          publicKey: publicKeyCredentialRequestOptions
        });

        if (assertion) {
          // Login biométrico concluído com sucesso!
          document.getElementById('auth-screen').classList.add('hidden');
          document.getElementById('user-display-email').innerText = savedEmail || 'Sincronizado';
        }
      } catch (err) {
        console.error('Erro na biometria:', err);
        showError('Falha na verificação biométrica. Tente e-mail e senha.');
      }
    }

    // Lógica do Form de Login / Cadastro Padrão
    function handleAuthSubmit(event) {
      event.preventDefault();
      const email = document.getElementById('auth-email').value;

      // Simulação de Sucesso no Login Firebase
      localStorage.setItem('user_email', email);
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('user-display-email').innerText = email;

      // Sugere ao utilizador registar a biometria após entrar se ainda não tiver
      if (!localStorage.getItem('bio_cred_id') && isBiometricSupported) {
        document.getElementById('biometric-prompt-card').classList.remove('hidden');
      }
    }

    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('auth-title').innerText = isSignUpMode ? 'Criar Conta' : 'Segurança do App';
      document.getElementById('auth-btn-text').innerText = isSignUpMode ? 'Criar Conta' : 'Entrar';
      document.getElementById('auth-toggle-btn').innerText = isSignUpMode 
        ? 'Já tem uma conta? Clique para entrar' 
        : 'Não tem conta? Clique para criar uma';
    }

    function showError(msg) {
      const errDiv = document.getElementById('auth-error');
      errDiv.innerText = msg;
      errDiv.classList.remove('hidden');
    }

    function logout() {
      document.getElementById('auth-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
